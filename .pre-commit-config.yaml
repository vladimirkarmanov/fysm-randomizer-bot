repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        args: [--fix]
        language: system
        types: [python]
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: ruff format
        args: []
        language: python
        types: [python]
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: env PYTHONPATH=bot uv run mypy --config-file=pyproject.toml --show-traceback
        language: system
        types: [python]
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.3
    hooks:
      - id: uv-lock


exclude: 'alembic/.*|tests/.*'
